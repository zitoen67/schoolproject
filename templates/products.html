<head>
<meta charset="UTF-8">

<title>Collectie | VÉRRO</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; color: #171717; }
header {
    height: 76px; padding: 0 7%; display: flex;
    align-items: center; justify-content: space-between;
    border-bottom: 1px solid #eee;
}
.logo { font-size: 27px; font-weight: bold; letter-spacing: 5px; }
a { color: inherit; text-decoration: none; }
.back { font-size: 14px; }
main { padding: 55px 7%; }
h1 { font-size: 36px; margin-bottom: 12px; }
.intro { color: #777; margin-bottom: 35px; }
.categories {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-bottom: 40px;
}
.categories button {
    border: 1px solid #ddd; background: white;
    padding: 11px 19px; cursor: pointer;
}
.categories button.active,
.categories button:hover { background: #171717; color: white; }
.products {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}
.product img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover;
    background: #f2f2f2;
}
.product h3 { font-size: 16px; margin-top: 13px; }
.product p { color: #777; margin-top: 7px; }
@media(max-width: 800px) {
    .products { grid-template-columns: repeat(2, 1fr); }
    main { padding: 35px 5%; }
}
</style>
</head>
<body>
<header>
    <a class="logo" href="/">VÉRRO</a>
    <a class="back" href="/">← Terug naar home</a>
</header>

    <div class="categories">

        <button onclick="filterProducts('Jassen', this)">Jassen</button>

        <button onclick="filterProducts('Truien', this)">Truien</button>
        <button onclick="filterProducts('T-shirts', this)">T-shirts</button>
        <button onclick="filterProducts('Broeken', this)">Broeken</button>
        <button onclick="filterProducts('Jeans', this)">Jeans</button>
        <button onclick="filterProducts('Sneakers', this)">Sneakers</button>

    <div class="products" id="products"></div>
</main>

function showProducts(category) {
    const filtered = category === "Alle"
        ? products
        : products.filter(p => p.category === category);

    document.getElementById("products").innerHTML = filtered.map(p => `
        <div class="product">
            <img src="${p.image}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p>€${p.price.toFixed(2)}</p>
        </div>
    `).join("");
}

function filterProducts(category, button) {
    document.querySelectorAll(".categories button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    showProducts(category);
}

const params = new URLSearchParams(window.location.search);
const selectedCategory = params.get('categorie') || 'Alle';

const categoryButton = [...document.querySelectorAll('.categories button')]
    .find(button => button.textContent.trim() === selectedCategory);

if (categoryButton) {
    filterProducts(selectedCategory, categoryButton);
} else {
    showProducts('Alle');
}
