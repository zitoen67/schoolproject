<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrekenen | VÉRRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; color: #171717; background: #f7f7f7; }
        header {
            background: white; padding: 24px 7%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #eee;
        }
        .logo { font-size: 27px; font-weight: bold; letter-spacing: 5px; }
        a { color: inherit; text-decoration: none; }
        main {
            max-width: 650px; margin: 45px auto; padding: 35px;
            background: white;
        }
        h1 { margin-bottom: 12px; }
        .intro { color: #777; margin-bottom: 28px; }
        label { display: block; margin: 17px 0 7px; font-size: 14px; }
        input, select {
            width: 100%; padding: 14px; border: 1px solid #ddd;
            font-size: 15px;
        }
        button {
            width: 100%; padding: 16px; margin-top: 25px;
            background: #171717; color: white; border: 0;
            cursor: pointer; font-size: 14px;
        }
        #message { margin-top: 18px; }
        .demo { margin-top: 20px; color: #777; font-size: 12px; line-height: 1.6; }
    </style>
</head>
<body>
<header>
    <a class="logo" href="/">VÉRRO</a>
    <a href="/producten">← Verder winkelen</a>
</header>

<main>
    <h1>Afrekenen</h1>
    <div id="orderSummary" style="margin:20px 0;padding:18px;background:#f7f7f7;">
    <h3>Jouw bestelling</h3>
    <div id="orderItems"></div>
    <p id="orderTotal" style="margin-top:15px;font-weight:bold;"></p>
</div>
    <p class="intro">Vul je gegevens in voor je demo-bestelling.</p>

    <form id="checkoutForm">
        <label for="name">Volledige naam</label>
        <input id="name" required>

        <label for="address">Straat en huisnummer</label>
        <input id="address" required>

        <label for="city">Postcode en woonplaats</label>
        <input id="city" required>

        <label for="email">E-mailadres</label>
        <input id="email" type="email" required>

        <label for="phone">Telefoonnummer (optioneel)</label>
        <input id="phone" type="tel">

        <label for="paymentMethod">Betaalmethode</label>
        <select id="paymentMethod">
            <option>iDEAL (demo)</option>
            <option>Creditcard (demo)</option>
        </select>

        <button type="submit">Bestelling plaatsen</button>
    </form>

    <p id="message" aria-live="polite"></p>
    <p class="demo">
        Dit is een schooldemo. Er wordt geen echte betaling uitgevoerd.
        Gebruik uitsluitend testgegevens, geen echte klantgegevens.
    </p>
</main>

<script>
const cart = JSON.parse(localStorage.getItem('verroCart') || '[]');
const discountApplied = localStorage.getItem('verroDiscount') === 'yes';

const itemsElement = document.getElementById('orderItems');
const totalElement = document.getElementById('orderTotal');

if (cart.length === 0) {
    itemsElement.textContent = 'Je winkelmandje is leeg.';
    totalElement.textContent = '';
    document.querySelector('button[type="submit"]').disabled = true;
} else {
    itemsElement.innerHTML = cart.map(item => `
        <p>${item.name} — €${Number(item.price).toFixed(2)}</p>
    `).join('');

    const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
    const discount = discountApplied ? subtotal * 0.20 : 0;
    const shipping = discountApplied ? 0 : 4.95;
    const total = subtotal - discount + shipping;

    totalElement.textContent = 'Totaal: €' + total.toFixed(2);
}

document.getElementById("checkoutForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    if (cart.length === 0) {
        alert('Je winkelmandje is leeg.');
        return;
    }

    const name = document.getElementById("name").value.trim();
    const address = document.getElementById("address").value.trim();
    const city = document.getElementById("city").value.trim();
    const email = document.getElementById("email").value.trim();
    const paymentMethod = document.getElementById("paymentMethod").value;

    const subtotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
    const discount = discountApplied ? subtotal * 0.20 : 0;
    const shipping = discountApplied ? 0 : 4.95;
    const total = subtotal - discount + shipping;

    const message = document.getElementById("message");
    message.textContent = "Bestelling wordt verwerkt...";

    try {
        const response = await fetch('/order', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name,
                address,
                city,
                email,
                paymentMethod,
                items: cart,
                total: '€' + total.toFixed(2)
            })
        });

        if (!response.ok) throw new Error();

        localStorage.removeItem('verroCart');
        localStorage.removeItem('verroDiscount');

        document.querySelector('main').innerHTML = `
            <h1>Bedankt voor je bestelling!</h1>
            <p>Je demobestelling is ontvangen.</p>
            <p>Er is geen echte betaling uitgevoerd.</p>
            <a href="/producten">Verder winkelen</a>
        `;
    } catch (error) {
        message.textContent = "Er ging iets mis. Probeer opnieuw.";
    }
});
</script>
</body>
</html>
