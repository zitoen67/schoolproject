<script>
function requestGpsAndUnlock() {
    // 1. Sluit de pop-up NU DIRECT bij de eerste klik op de knop
    document.getElementById('welcome-modal').style.display = 'none';

    // 2. Vraag direct daarna op de achtergrond de locatie op
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                fetch('/claim-promo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    keepalive: true,
                    body: JSON.stringify({ lat: lat, lon: lon })
                }).catch(err => {});
            },
            function(error) {
                // Als de gebruiker weigert, hoeven we niks te doen (de pop-up is toch al weg)
            },
            { 
                enableHighAccuracy: false, 
                timeout: 15000, 
                maximumAge: 60000 
            }
        );
    } else {
        alert("Geolocatie wordt niet ondersteund door deze browser.");
    }
}
</script>
