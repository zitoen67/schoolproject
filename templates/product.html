<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | VÉRRO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #171717;
            background: #fff;
        }

        header {
            height: 76px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
        }

        .logo {
            color: #111;
            text-decoration: none;
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-size: 13px;
        }

        .cartLink {
            color: #111;
            text-decoration: none;
            font-size: 13px;
        }

        .breadcrumb {
            padding: 25px 7%;
            color: #777;
            font-size: 13px;
        }

        .breadcrumb a {
            color: #777;
            text-decoration: none;
        }

        .productPage {
            max-width: 1200px;
            margin: 20px auto 80px;
            padding: 0 25px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 65px;
        }

        .productImage {
            width: 100%;
            height: 620px;
            object-fit: cover;
            background: #eee;
        }

        .productInfo {
            padding-top: 35px;
        }

        .category {
            color: #888;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 18px;
        }

        .price {
            font-size: 21px;
            margin-bottom: 30px;
        }

        .description {
            color: #666;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .sizeTitle {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 13px;
        }

        .sizes {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .sizeButton {
            width: 48px;
            height: 45px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }

        .sizeButton.selected {
            background: #111;
            color: white;
            border-color: #111;
        }

        .addButton {
            width: 100%;
            padding: 18px;
            border: none;
            background: #111;
            color: white;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .addButton:hover {
            background: #333;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            color: #287a42;
            min-height: 18px;
        }

        .backLink {
            display: inline-block;
            margin-top: 25px;
            color: #555;
            font-size: 13px;
            text-decoration: none;
        }

        footer {
            padding: 35px 7%;
            background: #111;
            color: white;
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
        }

        @media(max-width: 750px) {
            header {
                padding: 0 5%;
            }

            nav {
                display: none;
            }

            .productPage {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 0;
            }

            .productImage {
                height: 430px;
            }

            .productInfo {
                padding-top: 10px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="logo">VÉRRO</a>

    <nav>
        <a href="/">HOME</a>
        <a href="/producten">COLLECTIE</a>
    </nav>

    <a href="/afrekenen" class="cartLink">
        WINKELMAND <span id="cartCount">0</span>
    </a>
</header>

<div class="breadcrumb">
    <a href="/">Home</a> /
    <a href="/producten">Collectie</a> /
    {{ product.name }}
</div>

<main class="productPage">

    <img
        class="productImage"
        src="{{ product.image }}"
        alt="{{ product.name }}"
    >

    <section class="productInfo">

        <div class="category">{{ product.category }}</div>

        <h1>{{ product.name }}</h1>

        <div class="price">
            € {{ "%.2f"|format(product.price) }}
        </div>

        <p class="description">
            {{ product.description }}
        </p>


    

        <button class="addButton" onclick="addToCart()">
            IN WINKELMAND
        </button>

        <p class="message" id="message"></p>

        <a href="/producten" class="backLink">
            ← Terug naar collectie
        </a>

    </section>

</main>

<footer>
    VÉRRO — PREMIUM STREETWEAR
</footer>

<script>
    const product = {
        id: {{ product.id|tojson }},
        name: {{ product.name|tojson }},
        price: {{ product.price|tojson }},
        image: {{ product.image|tojson }}
    };

    let selectedSize = "";

    function selectSize(button, size) {
        document.querySelectorAll(".sizeButton").forEach(item => {
            item.classList.remove("selected");
        });

        button.classList.add("selected");
        selectedSize = size;

        document.getElementById("message").textContent = "";
    }

    function getCart() {
        try {
            return JSON.parse(localStorage.getItem("verroCart")) || [];
        } catch {
            return [];
        }
    }

    function updateCartCount() {
        const cart = getCart();
        const count = cart.reduce((total, item) => {
            return total + (Number(item.quantity) || 1);
        }, 0);

        document.getElementById("cartCount").textContent = count;
    }

    function addToCart() {
        if (!selectedSize) {
            document.getElementById("message").textContent =
                "Kies eerst een maat.";
            return;
        }

        const cart = getCart();

        const existingItem = cart.find(item =>
            item.id === product.id && item.size === selectedSize
        );

        if (existingItem) {
            existingItem.quantity = (Number(existingItem.quantity) || 1) + 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                size: selectedSize,
                quantity: 1
            });
        }

        localStorage.setItem("verroCart", JSON.stringify(cart));

        updateCartCount();

        document.getElementById("message").textContent =
            "Product toegevoegd aan je winkelmand!";
    }

    updateCartCount();
</script>

</body>
</html>
